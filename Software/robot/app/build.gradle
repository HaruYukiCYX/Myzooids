plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.sensor'
    compileSdk 34

    android {
        // ...
        sourceSets {
            main {
                jniLibs.srcDirs = ['src/main/jniLibs']
            }
        }
    }

    defaultConfig {
        applicationId "com.example.robot"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 添加相机支持的ABI架构
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        // 确保不排除 .so 文件
        pickFirst 'lib/**/*.so'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // 如需完全抑制警告，可在gradle.properties添加：
    // android.javaCompile.suppressSourceTargetDeprecationWarning=true
}

dependencies {
    // 基础依赖
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // CameraX 完整依赖（关键部分）
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:$camerax_version"       // 核心功能
    implementation "androidx.camera:camera-camera2:$camerax_version"   // 相机2兼容层
    implementation "androidx.camera:camera-lifecycle:$camerax_version" // 生命周期绑定
    implementation "androidx.camera:camera-view:$camerax_version"      // 预览视图控件
    implementation "androidx.camera:camera-extensions:$camerax_version" // 相机扩展功能

    // 其他已有依赖
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.code.gson:gson:2.8.9'

    implementation project(":opencv344-contrib")

}
